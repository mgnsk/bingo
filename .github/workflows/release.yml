# Builds dist/ and attaches it to the release as bingo-dist.tar.gz (the
# contents of dist/, no top-level directory).
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar -czf bingo-dist.tar.gz -C dist .
      - run: gh release upload "$TAG" bingo-dist.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
